<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Vesper listening</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <style>
      :root {
        --sky: #8fb4ff;
        --beam: #6f8cff;
        --bone: #ecebe8;
        --mist: #a3a6ae;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif;
        -webkit-user-select: none;
      }
      body {
        display: flex;
        align-items: flex-end;
        justify-content: center;
      }
      .pill {
        display: flex;
        align-items: center;
        gap: 12px;
        height: 44px;
        padding: 0 16px 0 14px;
        margin-bottom: 6px;
        border-radius: 22px;
        background: rgba(16, 17, 21, 0.94);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.06);
        color: var(--bone);
        opacity: 0;
        transform: translateY(10px) scale(0.96);
        transition:
          opacity 0.25s ease,
          transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1),
          max-width 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
        max-width: 260px;
      }
      .pill.on {
        opacity: 1;
        transform: none;
      }
      .pill.heard {
        max-width: 560px;
      }
      .dot {
        flex: none;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #fff, var(--sky) 55%, var(--beam));
        box-shadow: 0 0 12px var(--beam);
        animation: breathe 1.4s ease-in-out infinite;
      }
      @keyframes breathe {
        50% {
          transform: scale(0.8);
          opacity: 0.7;
        }
      }
      .bars {
        display: flex;
        align-items: center;
        gap: 3px;
        height: 24px;
      }
      .bars i {
        width: 3px;
        height: 4px;
        border-radius: 3px;
        background: var(--sky);
        transition: height 0.08s linear;
      }
      .pill.transcribing .bars i {
        height: 4px !important;
        animation: wave 1s ease-in-out infinite;
      }
      @keyframes wave {
        50% {
          height: 12px;
          opacity: 0.5;
        }
      }
      .label {
        font-size: 12px;
        color: var(--mist);
        white-space: nowrap;
      }
      .time {
        font: 11px ui-monospace, 'SF Mono', monospace;
        color: var(--mist);
        min-width: 30px;
        text-align: right;
      }
      .text {
        display: none;
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .pill.heard .bars,
      .pill.heard .time {
        display: none;
      }
      .pill.heard .text {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="pill" id="pill">
      <span class="dot"></span>
      <span class="label" id="label">Listening</span>
      <span class="bars" id="bars"></span>
      <span class="text" id="text"></span>
      <span class="time" id="time">0:00</span>
    </div>
    <script type="module" src="./src/overlay.ts"></script>
  </body>
</html>
